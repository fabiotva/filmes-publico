<style>
/* Layout: cabeçalho escuro em grafite com o logo e a contagem, abas em pílula, gêneros em cartões com fio de bronze.
   Cores da marca FRL: grafite, pedra clara, pedra e bronze. Fonte Figtree. */
:root {
  --bg: #F1EFEB;
  --surface: #FBFAF8;
  --ink: #3A3D43;
  --muted: #6B6F77;
  --line: #D3CEC5;
  --bronze: #9B6A3C;
  --bronze-soft: #EADFD0;
  --hero: #3A3D43;
  --hero-ink: #F1EFEB;
  --hero-muted: #C9C5BC;
  --hero-accent: #C99763;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A2D32; --surface: #34373D; --ink: #F1EFEB; --muted: #B9B5AC; --line: #474B53;
    --bronze: #C99763; --bronze-soft: #433A2F; --hero: #3A3D43; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A2D32; --surface: #34373D; --ink: #F1EFEB; --muted: #B9B5AC; --line: #474B53;
  --bronze: #C99763; --bronze-soft: #433A2F; --hero: #3A3D43; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; margin: 0;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--hero); z-index: 10; }
.wrap { max-width: 640px; margin: 0 auto; }

/* cabeçalho */
.hero {
  background: var(--hero); color: var(--hero-ink);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 26px max(16px, env(safe-area-inset-left, 0px)) 76px;
}
.hero-in { max-width: 640px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 14px; }
.mark { width: 52px; height: 52px; flex: none; }
.brand-t { display: flex; flex-direction: column; line-height: 1; }
.brand-t b { font-weight: 700; font-size: 26px; letter-spacing: .28em; margin-right: -.28em; }
.brand-t span { font-weight: 600; font-size: 11px; letter-spacing: .34em; margin-top: 7px; color: var(--hero-accent); text-transform: uppercase; }
.hero h1 { font-size: 25px; line-height: 1.2; font-weight: 700; margin: 26px 0 0; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--hero-muted); font-size: 15px; }

/* abas e busca */
.ctl { margin-top: -50px; display: flex; flex-direction: column; gap: 10px; }
.tabs {
  display: flex; gap: 4px; padding: 4px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(58,61,67,.14);
}
.tabs button[hidden] { display: none; }
.tabs button {
  flex: 1; font: 600 15px var(--font); color: var(--muted); background: transparent; border: 0; border-radius: 12px;
  min-height: 48px; padding: 8px 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tabs button .n { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--bronze-soft); color: var(--bronze); font-variant-numeric: tabular-nums; }
.tabs button[aria-selected="true"] { background: var(--hero); color: var(--hero-ink); }
.tabs button[aria-selected="true"] .n { background: var(--hero-accent); color: #3A3D43; }
.search {
  width: 100%; font: 400 16px var(--font); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px; min-height: 48px;
}
.search::placeholder { color: var(--muted); }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.aviso { margin: 18px 2px 14px; font-size: 14px; color: var(--muted); }

/* gêneros */
#lista { display: flex; flex-direction: column; gap: 12px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px;
  font-weight: 700; font-size: 17px;
}
summary::-webkit-details-marker { display: none; }
summary .g { flex: 1; min-width: 0; }
summary .count { font-size: 12px; font-weight: 700; color: var(--bronze); background: var(--bronze-soft); border-radius: 99px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
summary .chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; }
details[open] > summary .chev { transform: rotate(-135deg); margin-top: 5px; }
.gnote { margin: 0; padding: 0 16px 10px; font-size: 13px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 13px 16px 14px; border-top: 1px solid var(--line); min-width: 0; }
.t { font-weight: 600; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 5px; font-size: 13px; color: var(--muted); }
.rate { font-weight: 700; color: var(--bronze); background: var(--bronze-soft); border-radius: 99px; padding: 1px 9px; font-variant-numeric: tabular-nums; }
.d { font-size: 14px; margin-top: 6px; color: var(--ink); opacity: .86; overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }
.pickbtn {
  font: 700 12px var(--font); color: var(--hero-ink); background: var(--hero); border: 0; border-radius: 99px;
  padding: 7px 12px 7px 10px; min-height: 32px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.pickbtn::before { content: ""; border-left: 8px solid var(--hero-accent); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.pick { margin: 0 12px 10px; padding: 12px 14px; border-radius: 12px; background: var(--hero); color: var(--hero-ink); display: flex; flex-direction: column; gap: 4px; }
.pick small { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--hero-accent); }
.pick b { font-size: 17px; line-height: 1.3; }
.pick span { font-size: 14px; color: var(--hero-muted); }
li.is-pick .t::after { content: "Comece por este"; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--bronze); background: var(--bronze-soft); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
li:not(.is-pick) .t::after { content: none; }
details:not(.pick-on) li.is-pick .t::after { content: none; }
.vistobtn {
  font: 600 13px var(--font); color: var(--bronze); background: transparent; border: 1px solid var(--bronze); border-radius: 99px;
  min-height: 36px; padding: 6px 14px; cursor: pointer; margin-top: 10px;
}
.vote { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.vote .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vote .opts button {
  font: 600 13px var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  min-height: 48px; padding: 8px 10px; cursor: pointer; text-align: left; line-height: 1.25;
}
.vote .opts button[aria-pressed="true"] { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.vote textarea {
  width: 100%; font: 400 15px var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; min-height: 64px; resize: vertical;
}
.vote .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.vote .acts button { font: 700 14px var(--font); min-height: 44px; padding: 8px 16px; border-radius: 99px; cursor: pointer; }
.vote .save { background: var(--hero); color: var(--hero-ink); border: 0; }
.vote .save:disabled { opacity: .4; cursor: default; }
.vote .cancel, .vote .clear { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.vtag { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--bronze); background: var(--bronze-soft); border-radius: 99px; padding: 2px 10px; }
.vnote { font-size: 13px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
li.visto .t { opacity: .75; }
footer { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .chev { transition: transform .15s; } }
</style>

<div class="wrap">

<script>

    for (const g of ver.grupos) {
      for (const i of g.itens) {
        if (!(votos[slug(i[0])] && votos[slug(i[0])].voto === "indicar")) continue;
        const nome = SEG[g.nome] || g.nome;
        let alvo = grupos.find((x) => x.nome === nome);
        if (!alvo) { alvo = { nome, itens: [] }; grupos.push(alvo); }
        alvo.itens.push(i);
      }
    }
    return { aviso: DATA.indicar.aviso, grupos };
  }
  if (view === "quero-ver") {
    return { aviso: ver.aviso, grupos: ver.grupos.map((g) => ({ ...g, pick: g.pick && !votos[slug(g.pick[0])] ? g.pick : undefined, itens: g.itens.filter((i) => !votos[slug(i[0])]) })) };
  }
  const todos = ver.grupos.flatMap((g) => g.itens);
  return {
    aviso: "O que já assisti, com o meu voto.",
    grupos: Object.entries(VOTOS).map(([k, r]) => ({ nome: r, itens: [...VISTOS.filter((i) => i[4] === k), ...todos.filter((i) => votos[slug(i[0])] && votos[slug(i[0])].voto === k)] }))
  };
}
function contadores() {
  const ver = DATA["quero-ver"].grupos.flatMap((g) => g.itens);
  const vistos = ver.filter((i) => votos[slug(i[0])]).length;
  $("#n-ver").textContent = ver.length - vistos;
  $("#n-vis").textContent = vistos + VISTOS.length;
  $("#n-ind").textContent = count("indicar") + ver.filter((i) => votos[slug(i[0])] && votos[slug(i[0])].voto === "indicar").length;
  $("#resumo").textContent = (ver.length - vistos) + " pra assistir e " + count("indicar") + " que eu indico.";
}

function render() {
  const q = norm($("#busca").value.trim());
  const v = visao();
  contadores();
  $("#aviso").textContent = v.aviso;
  let html = "", total = 0;
  for (const g of v.grupos) {
    const itens = g.itens.filter((i) => !q || norm(i[0] + " " + i[1]).includes(q));
    if (!itens.length) continue;
    total += itens.length;
    html += `<details open><summary><span class="g">${esc(g.nome)}</span>${g.pick ? `<button type="button" class="pickbtn" aria-label="Qual ver primeiro em ${esc(g.nome)}">Qual ver?</button>` : ""}<span class="count">${itens.length}</span><span class="chev"></span></summary>`;
    if (g.pick) html += `<div class="pick" hidden><small>Comece por</small><b>${esc(g.pick[0])}</b><span>${esc(g.pick[1])}</span></div>`;
    if (g.nota) html += `<p class="gnote">${esc(g.nota)}</p>`;
    html += "<ul>" + itens.map((i) => {
      const id = slug(i[0]), vt = votos[id];
      const cls = [g.pick && i[0] === g.pick[0] ? "is-pick" : "", vt ? "visto" : ""].filter(Boolean).join(" ");
      let extra = "";
      if (db && view !== "indicar" && !i[4]) {
        if (vt) extra += `<span class="vtag">${esc(VOTOS[vt.voto] || vt.voto)}</span>${vt.nota ? `<div class="vnote">${esc(vt.nota)}</div>` : ""}`;
        if (aberto === id) {
          extra += `<div class="vote" data-id="${id}"><div class="opts">${Object.entries(VOTOS).map(([k, r]) => `<button type="button" data-voto="${k}" aria-pressed="${rascunho.voto === k}">${esc(r)}</button>`).join("")}</div><textarea placeholder="Por quê? (se quiser)" aria-label="Observação">${esc(rascunho.nota)}</textarea><div class="acts"><button type="button" class="save" ${rascunho.voto ? "" : "disabled"}>Salvar</button><button type="button" class="cancel">Cancelar</button>${vt ? '<button type="button" class="clear">Tirar voto</button>' : ""}</div></div>`;
        } else {
          extra += `<div><button type="button" class="vistobtn" data-abrir="${id}" data-titulo="${esc(i[0])}">${vt ? "Mudar voto" : "Já vi"}</button></div>`;
        }
      }
      return `<li${cls ? ` class="${cls}"` : ""}><div class="t">${esc(i[0])}</div><div class="m"><span>${esc(i[1])}</span>${i[2] ? `<span class="rate">${esc(i[2])}</span>` : ""}</div>${i[3] ? `<div class="d">${esc(i[3])}</div>` : ""}${extra}</li>`;
    }).join("") + "</ul></details>";
  }
  $("#lista").innerHTML = total ? html : '<p class="empty">Nada encontrado.</p>';
}

function setView(next, fromHash) {
  view = next;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  if (!fromHash) { try { location.hash = view; } catch (e) {} }
  render();
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
$("#busca").addEventListener("input", render);
$("#lista").addEventListener("click", (e) => {
  const btn = e.target.closest(".pickbtn");
  if (!btn) return;
  e.preventDefault();
  const d = btn.closest("details");
  const box = d.querySelector(".pick");
  d.open = true;
  box.hidden = !box.hidden;
  d.classList.toggle("pick-on", !box.hidden);
});
$("#lista").addEventListener("click", async (e) => {
  const abrir = e.target.closest(".vistobtn");
  if (abrir) {
    const id = abrir.dataset.abrir, vt = votos[id];
    aberto = id; rascunho = { voto: vt ? vt.voto : "", nota: vt ? vt.nota || "" : "", titulo: abrir.dataset.titulo };
    render(); return;
  }
  const box = e.target.closest(".vote");
  if (!box) return;
  const op = e.target.closest("[data-voto]");
  if (op) { rascunho.nota = box.querySelector("textarea").value; rascunho.voto = op.dataset.voto; render(); return; }
  if (e.target.closest(".cancel")) { aberto = null; render(); return; }
  const id = box.dataset.id;
  try {
    if (e.target.closest(".clear")) { await db.collection("votos").doc(id).delete(); aberto = null; }
    else if (e.target.closest(".save") && rascunho.voto) {
      await db.collection("votos").doc(id).set({ titulo: rascunho.titulo, voto: rascunho.voto, nota: box.querySelector("textarea").value.trim(), em: new Date().toISOString().slice(0, 10) });
      aberto = null;
    }
  } catch (err) { alert("Não consegui salvar o voto agora. Tente de novo."); return; }
  render();
});
const VIEWS = ["quero-ver", "indicar", "vistos"];
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && (h !== "vistos" || db)) setView(h, true); });
{ const h = location.hash.slice(1); setView(h === "indicar" ? h : "quero-ver", true); }

      snap.forEach((d) => { m[d.id] = d.data(); });
      votos = m; render();
    }, () => {});
    render();

})();
